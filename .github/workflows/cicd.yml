name: Build-Test-Release-Pipeline

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  # ==========================================
  # 1. BUILD JOB
  # ==========================================
  build:
    name: 🔨 Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Software
        run: |
          npx @vercel/ncc build src/index.js -o dist --license licenses.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 1

  # ==========================================
  # 2. UNIT TEST & MATRIX & COVERAGE GATE (Grade O)
  # ==========================================
  test-unit:
    name: 🧪 Unit Tests & Coverage Gate
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [18, 20]
        os: [ubuntu-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests & Coverage Gate
        run: |
          echo "Running automated unit tests on Node ${{ matrix.node-version }}..."
          npm run test:unit

      - name: Upload Coverage Report Artifact
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: reports/
          retention-days: 7

  # ==========================================
  # 3. INTEGRATION TEST (Grade E)
  # ==========================================
  test-integration:
    name: 🔗 Integration Tests
    needs: test-unit
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      - name: Run Integration Tests
        run: |
          echo "Executing integration tests against TEST_ENV=${{ env.TEST_ENV }}..."
          npm run test:integration

  # ==========================================
  # 4. AUTOMATED FAILURE NOTIFICATION (Grade O)
  # ==========================================
  notify-on-failure:
    name: 🚨 Report Failure
    needs: [test-unit, test-integration]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Issue on Test Failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "❌ CI Pipeline Failed on Commit ${{ github.sha }}" \
            --body "Automated tests failed in run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Release has been gated and blocked."

  # ==========================================
  # 5. DEPLOY STAGING (Grade E)
  # ==========================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    needs: test-integration
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      - name: Create Staging Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="staging-$(date +%s)"
          echo "Deploying to Staging with tag $TAG..."
          gh release create "$TAG" dist/* --title "Staging $TAG" --notes "Automated release to staging after all tests passed."

  # =最新修復===================================
  # 6. DEPLOY PRODUCTION (Grade E/O - Manual Review Gate)
  # ==========================================
  deploy-production:
    name: 👑 Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      - name: Create Production Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="prod-$(date +%s)"
          echo "Deploying to Production with tag $TAG..."
          gh release create "$TAG" dist/* --title "Production $TAG" --notes "Production release approved and verified."
