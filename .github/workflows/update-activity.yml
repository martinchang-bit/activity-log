name: Update GitHub Activity

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update GitHub Activity
        uses: ./
        with:
          GITHUB_USERNAME: "martinchang-bit"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
